<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; padding-top: 60px; background: #f0f2f5;">

    <h2 style="color: #075e54;">WhatsApp Bridge</h2>
    <p id="status" style="color: #666; padding: 0 20px;">Tippe auf Verbinden, um Benachrichtigungen zu starten:</p>
    
    <button id="connect-btn" style="padding: 15px 30px; font-size: 16px; background: #25d366; color: white; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">Verbinden</button>

    <script>
        const ntfyTopic = "david-whatsapp-test-1234";

        document.getElementById('connect-btn').addEventListener('click', async () => {
            if ('serviceWorker' in navigator) {
                await navigator.serviceWorker.register('sw.js');
            }

            const permission = await Notification.requestPermission();
            if (permission !== 'granted') {
                alert('Bitte erlaube Benachrichtigungen!');
                return;
            }

            document.getElementById('status').innerText = 'Status: Verbunden & lauscht...';
            document.getElementById('connect-btn').style.background = '#128c7e';
            document.getElementById('connect-btn').innerText = 'Aktiv & Verbunden';

            const eventSource = new EventSource(`https://ntfy.sh/${ntfyTopic}/sse`);

            eventSource.onmessage = function (event) {
                try {
                    const data = JSON.parse(event.data);
                    
                    if (data.event === 'message') {
                        // Der Name des Absenders (z.B. Mama) wird der Haupttitel
                        const senderName = data.title || "WhatsApp";
                        // Die Nachricht wird der Body
                        const messageBody = data.message || "Neue Nachricht";

                        navigator.serviceWorker.ready.then(reg => {
                            reg.showNotification(senderName, {
                                body: messageBody,
                                icon: 'icon.png',
                                badge: 'icon.png',
                                tag: 'whatsapp-fake'
                            });
                        });
                    }
                } catch (e) {
                    console.error("Fehler", e);
                }
            };
        });
    </script>
</body>
</html>
