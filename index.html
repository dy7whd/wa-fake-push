<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body style="font-family: -apple-system, sans-serif; text-align: center; padding-top: 60px; background: #f0f2f5;">

    <h2 style="color: #075e54;">WhatsApp Bridge</h2>
    <p id="status" style="color: #666; padding: 0 20px;">Tippe auf Verbinden:</p>
    <button id="connect-btn" style="padding: 15px 30px; font-size: 16px; background: #25d366; color: white; border: none; border-radius: 25px; font-weight: bold; cursor: pointer;">Verbinden</button>

    <script>
        const ntfyTopic = "david-whatsapp-test-1234";

        document.getElementById('connect-btn').addEventListener('click', async () => {
            if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
                alert('Push wird nicht unterstützt.');
                return;
            }

            const permission = await Notification.requestPermission();
            if (permission !== 'granted') {
                alert('Bitte Benachrichtigungen erlauben!');
                return;
            }

            try {
                const reg = await navigator.serviceWorker.register('sw.js');
                await navigator.serviceWorker.ready;

                // Korrigierter Endpoint für ntfy Web-Push
                const response = await fetch(`https://ntfy.sh/${ntfyTopic}/push/pubkey`);
                const vapidPublicKey = await response.text();
                
                // VAPID-Key konvertieren
                const convertedKey = urlBase64ToUint8Array(vapidPublicKey.trim());

                const subscription = await reg.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: convertedKey
                });

                await fetch(`https://ntfy.sh/${ntfyTopic}/push/subscribe`, {
                    method: 'POST',
                    body: JSON.stringify(subscription)
                });

                document.getElementById('status').innerText = 'Aktiv & Verbunden!';
                document.getElementById('connect-btn').style.background = '#128c7e';
                document.getElementById('connect-btn').innerText = 'Verbunden';
                alert('Erfolgreich verbunden!');
            } catch (err) {
                alert('Fehler: ' + err.message);
            }
        });

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }
    </script>
</body>
</html>
